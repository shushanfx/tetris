name: unit-test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.ts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/package.json'
      - '.github/workflows/unit-test.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: unit-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 仓库未提交 yarn.lock，无法用 setup-node 自带缓存，按 package.json 哈希手动缓存
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install
        env:
          HUSKY: 0

      - name: Run unit tests with coverage
        id: test
        run: yarn workspace @shushanfx/tetris-core run test:ci
        continue-on-error: true

      - name: Report result to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readJson = (p) =>
              fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : null;
            const results = readJson('packages/core/test-results.json');
            const coverage = readJson('packages/core/coverage/coverage-summary.json');
            const marker = '<!-- unit-test-result -->';
            const status = '${{ steps.test.outcome }}';
            const icon = status === 'success' ? '✅' : '❌';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            let body = `${marker}\n### ${icon} 单元测试全量运行（${status}，提交 ${sha}）\n\n`;
            if (results) {
              body += `| 指标 | 结果 |\n| --- | --- |\n`;
              body += `| 测试文件 | ${results.numPassedTestSuites}/${results.numTotalTestSuites} 通过 |\n`;
              body += `| 测试用例 | ${results.numPassedTests}/${results.numTotalTests} 通过 |\n`;
              if (results.numFailedTests > 0) {
                body += `| 失败用例 | ${results.numFailedTests} |\n`;
              }
            } else {
              body += '⚠️ 未生成测试结果文件，请查看工作流日志\n';
            }

            if (coverage && coverage.total) {
              const labels = {
                statements: '语句',
                branches: '分支',
                functions: '函数',
                lines: '行',
              };
              body += `\n#### 代码覆盖率\n\n| 类型 | 覆盖率 | 覆盖/总数 |\n| --- | --- | --- |\n`;
              for (const [key, label] of Object.entries(labels)) {
                const item = coverage.total[key];
                body += `| ${label} | ${item.pct}% | ${item.covered}/${item.total} |\n`;
              }
            } else {
              body += '\n⚠️ 未生成覆盖率报告，请查看工作流日志\n';
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
