name: lint-increment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lint-increment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 仓库未提交 yarn.lock，无法用 setup-node 自带缓存，按 package.json 哈希手动缓存
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install
        env:
          HUSKY: 0

      - name: Lint changed files
        id: lint
        run: bash .github/scripts/lint-increment.sh "origin/${{ github.base_ref }}"
        continue-on-error: true

      - name: Report result to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lint-increment-result -->';
            const report = fs.existsSync('lint-report.md')
              ? fs.readFileSync('lint-report.md', 'utf8')
              : '⚠️ 未生成 lint 报告';
            const status = '${{ steps.lint.outcome }}';
            const icon = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n### ${icon} 增量代码 Lint（${status}）\n\n${report}\n\n<sub>提交: ${sha}</sub>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
